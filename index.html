<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma de Marca | Artesanías Maverick & Variedades Franco</title>
    <meta name="description" content="Mini App minimalista para el cronograma de actividades de Manual de Marca para Artesanías Maverick y Variedades Franco.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            maverick: '#0284c7',
                            franco: '#ea580c'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#f4f6fb] dark:bg-[#090d16] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-pink-500 selection:text-white transition-colors duration-300">

    <!-- Top Navigation Bar (Clean Minimalist with Dark/Light Toggle) -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md shadow-sm border-b border-slate-100 dark:border-slate-800/80 no-print transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            
            <!-- App Logo / Title -->
            <div class="flex items-center gap-3.5">
                <div class="w-11 h-11 rounded-2xl bg-grad-pink p-0.5 shadow-md shadow-pink-500/20 flex items-center justify-center text-white">
                    <i data-lucide="layers" class="w-5 h-5"></i>
                </div>
                <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-pink-600 dark:text-pink-400">Manual de Marca 2026</span>
                    <h1 class="text-lg md:text-xl font-extrabold text-slate-900 dark:text-white tracking-tight flex items-center gap-2">
                        Cronograma de Actividades
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-pink-50 text-pink-700 dark:bg-pink-950/60 dark:text-pink-300 hidden sm:inline-block">Equipo</span>
                    </h1>
                </div>
            </div>

            <!-- Team Avatars Summary -->
            <div class="hidden lg:flex items-center gap-3 bg-slate-50 dark:bg-slate-800/60 px-4 py-2 rounded-2xl">
                <span class="text-xs text-slate-500 dark:text-slate-400 font-bold">Integrantes:</span>
                <div class="flex -space-x-2">
                    <div class="w-8 h-8 rounded-full bg-blue-500 text-white text-xs font-bold flex items-center justify-center ring-2 ring-white dark:ring-slate-900 shadow-sm" title="José Luis Vásquez">JV</div>
                    <div class="w-8 h-8 rounded-full bg-rose-500 text-white text-xs font-bold flex items-center justify-center ring-2 ring-white dark:ring-slate-900 shadow-sm" title="Marcela Castillo">MC</div>
                    <div class="w-8 h-8 rounded-full bg-emerald-500 text-white text-xs font-bold flex items-center justify-center ring-2 ring-white dark:ring-slate-900 shadow-sm" title="Ezequiel Medrano">EM</div>
                </div>
            </div>

            <!-- Action Controls & Dark Mode Switcher -->
            <div class="flex items-center gap-2">
                
                <!-- Dark / Light Mode Toggle Button -->
                <button id="btn-toggle-theme" title="Cambiar tema claro / oscuro" 
                        class="p-2.5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-amber-400 hover:scale-105 transition shadow-sm flex items-center gap-1.5">
                    <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
                    <span id="theme-text" class="text-xs font-bold hidden md:inline">Modo Oscuro</span>
                </button>

                <button id="btn-new-task" class="px-4 py-2.5 bg-grad-pink text-white text-xs sm:text-sm font-bold rounded-2xl shadow-lg shadow-pink-500/25 hover:opacity-95 transition flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Nueva Tarea</span>
                </button>

                <!-- Tools buttons -->
                <div class="flex items-center gap-1 bg-slate-50 dark:bg-slate-800/60 p-1 rounded-2xl">
                    <button id="btn-export-csv" title="Exportar CSV" class="p-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-white dark:hover:bg-slate-700 rounded-xl transition">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-export-json" title="Copia JSON" class="p-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-white dark:hover:bg-slate-700 rounded-xl transition">
                        <i data-lucide="download" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-print-report" title="Imprimir / PDF" class="p-2 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-white dark:hover:bg-slate-700 rounded-xl transition">
                        <i data-lucide="printer" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-reset-data" title="Restablecer Datos" class="p-2 text-slate-500 dark:text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-xl transition">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full space-y-7">
        
        <!-- Company Switcher Tabs & View Tabs -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 no-print">
            
            <!-- Company Tabs -->
            <div class="flex p-1.5 rounded-2xl bg-slate-200/70 dark:bg-slate-800/80 w-full sm:w-auto overflow-x-auto shadow-inner">
                <button data-company-tab="maverick" class="flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition tab-active-maverick">
                    <span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span>
                    Artesanías Maverick
                </button>
                <button data-company-tab="franco" class="flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition text-slate-600 dark:text-slate-300">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                    Variedades Franco
                </button>
                <button data-company-tab="all" class="flex-1 sm:flex-none px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition text-slate-600 dark:text-slate-300">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i>
                    Vista Unificada
                </button>
            </div>

            <!-- View Tabs -->
            <div class="flex items-center gap-1.5 bg-slate-200/70 dark:bg-slate-800/80 p-1.5 rounded-2xl w-full sm:w-auto overflow-x-auto shadow-inner">
                <button data-view-tab="list" class="px-4 py-2 text-xs sm:text-sm font-bold rounded-xl bg-white dark:bg-slate-800 text-slate-800 dark:text-white shadow-sm flex items-center gap-2">
                    <i data-lucide="list" class="w-4 h-4"></i> Lista
                </button>
                <button data-view-tab="kanban" class="px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-slate-800/50 flex items-center gap-2 transition">
                    <i data-lucide="kanban" class="w-4 h-4"></i> Tablero
                </button>
                <button data-view-tab="brief" class="px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-slate-800/50 flex items-center gap-2 transition">
                    <i data-lucide="book-marked" class="w-4 h-4"></i> Brief & ADN
                </button>
                <button data-view-tab="metrics" class="px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-white/50 dark:hover:bg-slate-800/50 flex items-center gap-2 transition">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Métricas
                </button>
            </div>
        </div>

        <!-- Dynamic Company Hero Banner -->
        <section id="company-hero-banner"></section>

        <!-- Stats Overview Cards (Modern Minimalist Vibrant Gradients) -->
        <section id="stats-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5"></section>

        <!-- Filters & Search Toolbar (Floating Minimal Card) -->
        <section class="p-4 rounded-3xl minimal-panel bg-white dark:bg-slate-900 shadow-sm no-print">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                
                <!-- Search Input -->
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="search-input" placeholder="Buscar tarea o entregable..." 
                           class="w-full bg-slate-50 dark:bg-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-xs font-semibold text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-pink-500 transition">
                </div>

                <!-- Filter Assignee -->
                <div>
                    <select id="filter-assignee" class="custom-select-light w-full px-3 py-2.5 text-xs">
                        <option value="all">👥 Todos los encargados</option>
                        <option value="José Luis Vásquez">José Luis Vásquez</option>
                        <option value="Marcela Castillo">Marcela Castillo</option>
                        <option value="Ezequiel Medrano">Ezequiel Medrano</option>
                        <option value="Trabajo Grupal (Equipo)">Trabajo Grupal (Equipo)</option>
                    </select>
                </div>

                <!-- Filter Status -->
                <div>
                    <select id="filter-status" class="custom-select-light w-full px-3 py-2.5 text-xs">
                        <option value="all">📌 Todos los estados</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="en_proceso">En Proceso</option>
                        <option value="en_revision">En Revisión</option>
                        <option value="completada">Completada</option>
                    </select>
                </div>

                <!-- Filter Phase -->
                <div>
                    <select id="filter-phase" class="custom-select-light w-full px-3 py-2.5 text-xs">
                        <option value="all">📂 Todas las fases (1 a 8)</option>
                        <option value="fase1">Fase 1: Investigación & Briefing</option>
                        <option value="fase2">Fase 2: Identidad Visual (Logo & ADN)</option>
                        <option value="fase3">Fase 3: Manual de Marca Editorial</option>
                        <option value="fase4">Fase 4: Catálogo & Fotografía</option>
                        <option value="fase5">Fase 5: Piezas Gráficas Redes</option>
                        <option value="fase6">Fase 6: Sitio Web (UI/UX & Prototipo)</option>
                        <option value="fase7">Fase 7: Aplicaciones & Packaging</option>
                        <option value="fase8">Fase 8: Control de Calidad</option>
                    </select>
                </div>

            </div>
        </section>

        <!-- Dynamic Views Container -->
        <section id="view-container"></section>

    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 py-6 mt-12 text-center text-xs text-slate-500 dark:text-slate-400 no-print transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>Cronograma de Manual de Marca © 2026 | Desarrollado para <strong>Artesanías Maverick</strong> & <strong>Variedades Franco</strong></p>
            <p class="font-medium text-slate-600 dark:text-slate-300">Equipo: <strong>José Luis Vásquez</strong> • <strong>Marcela Castillo</strong> • <strong>Ezequiel Medrano</strong></p>
        </div>
    </footer>

    <!-- Task Modal (Add / Edit) -->
    <div id="task-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop-custom hidden">
        <div class="bg-white dark:bg-slate-900 rounded-3xl w-full max-w-xl p-6 md:p-8 modal-content-animated shadow-2xl space-y-6 border border-slate-100 dark:border-slate-800">
            
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900 dark:text-white">Nueva Tarea de Cronograma</h3>
                <button onclick="app.closeTaskModal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 p-1 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="task-form" class="space-y-4">
                <input type="hidden" id="task-id">

                <!-- Company -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Empresa</label>
                    <select id="task-company" class="custom-select-light w-full px-3.5 py-2.5 text-xs">
                        <option value="maverick">Artesanías Maverick</option>
                        <option value="franco">Variedades Franco</option>
                    </select>
                </div>

                <!-- Title -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Título de la Tarea *</label>
                    <input type="text" id="task-title" required placeholder="Ej: Diseño de Logotipo y Retícula..." 
                           class="w-full bg-slate-50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-xs font-semibold text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
                </div>

                <!-- Phase & Assignee -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Fase del Proyecto</label>
                        <select id="task-phase" class="custom-select-light w-full px-3 py-2.5 text-xs">
                            <option value="fase1">Fase 1: Investigación & Briefing</option>
                            <option value="fase2">Fase 2: Identidad Visual (Logo & ADN)</option>
                            <option value="fase3">Fase 3: Manual de Marca Editorial</option>
                            <option value="fase4">Fase 4: Catálogo & Fotografía</option>
                            <option value="fase5">Fase 5: Piezas Gráficas Redes Sociales</option>
                            <option value="fase6">Fase 6: Sitio Web (UI/UX & Prototipo)</option>
                            <option value="fase7">Fase 7: Aplicaciones & Packaging</option>
                            <option value="fase8">Fase 8: Control de Calidad & Entregables</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Persona Encargada</label>
                        <select id="task-assigned" class="custom-select-light w-full px-3 py-2.5 text-xs">
                            <option value="José Luis Vásquez">José Luis Vásquez</option>
                            <option value="Marcela Castillo">Marcela Castillo</option>
                            <option value="Ezequiel Medrano">Ezequiel Medrano</option>
                            <option value="Trabajo Grupal (Equipo)">Trabajo Grupal (Equipo)</option>
                        </select>
                    </div>
                </div>

                <!-- Status & Priority & Deadline -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Estado</label>
                        <select id="task-status" class="custom-select-light w-full px-3 py-2.5 text-xs">
                            <option value="pendiente">Pendiente</option>
                            <option value="en_proceso">En Proceso</option>
                            <option value="en_revision">En Revisión</option>
                            <option value="completada">Completada</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Prioridad</label>
                        <select id="task-priority" class="custom-select-light w-full px-3 py-2.5 text-xs">
                            <option value="alta">Alta</option>
                            <option value="media">Media</option>
                            <option value="normal">Normal</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Sprint / Fecha</label>
                        <input type="text" id="task-deadline" placeholder="Semana 2" 
                               class="w-full bg-slate-50 dark:bg-slate-800 rounded-xl px-3 py-2.5 text-xs font-semibold text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">¿Qué se va a hacer? (Descripción)</label>
                    <textarea id="task-desc" rows="2" placeholder="Detalla los pasos a seguir..." 
                              class="w-full bg-slate-50 dark:bg-slate-800 rounded-xl p-3 text-xs font-medium text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500"></textarea>
                </div>

                <!-- Deliverable -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Entregable Requerido</label>
                    <input type="text" id="task-deliverable" placeholder="Ej: Archivos .AI, .PNG y manual en PDF..." 
                           class="w-full bg-slate-50 dark:bg-slate-800 rounded-xl px-3.5 py-2.5 text-xs font-semibold text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-pink-500">
                </div>

                <!-- Buttons -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="app.closeTaskModal()" class="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                        Cancelar
                    </button>
                    <button type="submit" class="px-5 py-2.5 bg-grad-pink text-white rounded-xl text-xs font-bold transition shadow-lg shadow-pink-500/25">
                        Guardar Tarea
                    </button>
                </div>

            </form>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
